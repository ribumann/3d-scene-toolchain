[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "scene-toolchain"
version = "0.1.0"
description = "Evidence-linked hybrid Blender and Idol browser scenes"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "pydantic>=2.10,<3",
  "python-multipart>=0.0.20,<1",
  "Pillow>=11.1,<13",
  "numpy>=2.0,<3",
]

[project.optional-dependencies]
test = ["httpx>=0.28,<1", "jsonschema>=4.23,<5"]
ocr = ["opencv-python-headless>=4.10,<5"]
vision = ["opencv-python-headless>=4.10,<5", "transformers>=4.57,<5", "torch>=2.5", "torchvision>=0.20", "huggingface-hub>=0.34"]

[project.scripts]
scene-toolchain = "scene_pipeline.cli:main"

[tool.setuptools.packages.find]
where = ["services/pipeline"]
