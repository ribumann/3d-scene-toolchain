name: Trusted GPU benchmark

on:
  workflow_dispatch:
    inputs:
      cases:
        description: "Space-separated prompt case IDs (P01 P02 P03). Image uploads remain private until separate access is configured."
        default: "P01 P02 P03"
        required: true
        type: string
      publish_assets:
        description: "Publish generated procedural assets (no uploaded originals) as workflow artifacts"
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: scene-gpu-benchmark
  cancel-in-progress: false

jobs:
  readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      RUNNER_LABEL: ${{ vars.SCENE_GPU_RUNNER }}
      CASES: ${{ inputs.cases }}
    steps:
      - name: Validate configured runner and fixed case list before GPU allocation
        run: |
          python - <<'PY'
          import os
          label = os.environ.get("RUNNER_LABEL", "")
          if not label:
              raise SystemExit("Set SCENE_GPU_RUNNER to an actual configured GPU runner label. No GPU job was queued.")
          cases = os.environ["CASES"].split()
          if not cases or len(cases) != len(set(cases)) or any(c not in ("P01", "P02", "P03") for c in cases):
              raise SystemExit("Only unique P01/P02/P03 procedural cases are permitted in this public-repository workflow.")
          PY
  infer:
    needs: readiness
    if: vars.SCENE_GPU_RUNNER != ''
    runs-on: ${{ vars.SCENE_GPU_RUNNER }}
    timeout-minutes: 90
    environment: scene-gpu
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      SCENE_IDOL_MODEL_REVISION: ${{ vars.SCENE_IDOL_MODEL_REVISION }}
      SCENE_DINOV3_REVISION: ${{ vars.SCENE_DINOV3_REVISION }}
      SCENE_FLUX2_REVISION: ${{ vars.SCENE_FLUX2_REVISION }}
      SCENE_DETECTOR_REVISION: ${{ vars.SCENE_DETECTOR_REVISION }}
      SCENE_SEGMENTER_REVISION: ${{ vars.SCENE_SEGMENTER_REVISION }}
      CASES: ${{ inputs.cases }}
      ATTN_BACKEND: sdpa
    steps:
      - name: Configure isolated job storage
        run: echo "SCENE_DATA_DIR=$RUNNER_TEMP/scene-data" >> "$GITHUB_ENV"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Verify CUDA before installing inference packages
        run: nvidia-smi
      - name: Install declared toolchain and pinned Idol SDK
        run: |
          python -m venv "$RUNNER_TEMP/scene-venv"
          "$RUNNER_TEMP/scene-venv/bin/pip" install -e ".[vision]" -r requirements-idol.txt
          echo "$RUNNER_TEMP/scene-venv/bin" >> "$GITHUB_PATH"
      - name: Verify Blender is available
        run: blender --background --version
      - name: Execute only validated case IDs
        run: |
          python - <<'PY'
          import os, subprocess
          cases = os.environ["CASES"].split()
          if any(c not in ("P01", "P02", "P03") for c in cases):
              raise SystemExit("Unsupported case ID")
          subprocess.run(["scene-toolchain", "run", "--cases", *cases,
                          "--stages", "extract", "blender", "idol",
                          "--report", os.environ["RUNNER_TEMP"] + "/gpu-report.json"], check=True)
          PY
      - name: Publish batch report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: gpu-report
          path: ${{ runner.temp }}/gpu-report.json
          retention-days: 7
          if-no-files-found: warn
      - name: Publish approved procedural outputs only
        if: success() && inputs.publish_assets
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: procedural-scene-assets
          path: ${{ runner.temp }}/scene-data/assets
          retention-days: 7
      - name: Remove per-job credentials from the environment scope
        if: always()
        run: |
          echo "HF_TOKEN=" >> "$GITHUB_ENV"
