name: Trusted GPU benchmark

on:
  workflow_dispatch:
    inputs:
      smoke_mode:
        description: "Existing pilots, photographic trials, isolated exports, or generated illustrative references"
        default: "off"
        required: false
        type: choice
        options:
          - "off"
          - readiness
          - gpu
          - batch
          - package
          - trials
          - trial-package
          - illustrations
          - illustrated-objects
      smoke_source:
        description: "Explicit smoke/batch input; public-preview records authorized WebP provenance, never original bytes"
        default: private-original
        required: false
        type: choice
        options:
          - private-original
          - public-preview
      pilot_cases:
        description: "Batch: I01-I05/G01-G03; trials: explicit T01-T03 or licensed R01-R03 selection. Default preserves I02."
        default: "I02"
        type: string
        required: false
      publish_pilots:
        description: "Explicitly approve validated derived pilot scenes/PLY for public packaging; never originals/crops/logs"
        default: false
        type: boolean
      incremental_pilots:
        description: "Package mode only: publish stopped results now; active cases remain processing with no scene"
        default: false
        type: boolean
      trial_variants:
        description: "Trials only: baseline detector+SAM2 versus supervised optimized route"
        default: both
        type: choice
        options:
          - both
          - baseline
          - optimized
      publish_trials:
        description: "Explicitly approve additive photographic trial package, including licensed source-derived adaptations"
        default: false
        type: boolean
      cases:
        description: "Procedural cases; illustrations mode also accepts I01 I04 I05 for generated reference candidates"
        default: "P01 P02 P03"
        required: true
        type: string
      publish_assets:
        description: "Publish generated procedural assets (no uploaded originals) as workflow artifacts"
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: ${{ (inputs.smoke_mode == 'package' || inputs.smoke_mode == 'trial-package') && 'scene-pilot-publication' || 'scene-gpu-benchmark' }}
  cancel-in-progress: false

jobs:
  private-smoke:
    if: github.event_name == 'workflow_dispatch' && (inputs.smoke_mode == 'readiness' || inputs.smoke_mode == 'gpu' || inputs.smoke_mode == 'batch' || inputs.smoke_mode == 'trials' || inputs.smoke_mode == 'illustrations' || inputs.smoke_mode == 'illustrated-objects')
    uses: ./.github/workflows/gpu-smoke.yml
    with:
      run_gpu: ${{ inputs.smoke_mode == 'gpu' || inputs.smoke_mode == 'batch' || inputs.smoke_mode == 'trials' || inputs.smoke_mode == 'illustrations' || inputs.smoke_mode == 'illustrated-objects' }}
      illustration_batch: ${{ inputs.smoke_mode == 'illustrations' }}
      illustration_reconstruct: ${{ inputs.smoke_mode == 'illustrated-objects' }}
      illustration_cases: ${{ inputs.cases || 'P01 P02 P03' }}
      object_batch: ${{ inputs.smoke_mode == 'batch' || inputs.smoke_mode == 'trials' }}
      trial_batch: ${{ inputs.smoke_mode == 'trials' }}
      trial_variants: ${{ inputs.trial_variants || 'both' }}
      pilot_cases: ${{ inputs.pilot_cases || 'I02' }}
      publish_pilots: ${{ inputs.publish_pilots || false }}
      source: ${{ inputs.smoke_source || 'private-original' }}
    secrets:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
  publication-readiness:
    if: github.event_name == 'workflow_dispatch' && (inputs.smoke_mode == 'package' || inputs.smoke_mode == 'trial-package')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require explicit preview publication and a separate publisher runner
        env:
          APPROVE: ${{ inputs.publish_pilots }}
          SOURCE: ${{ inputs.smoke_source }}
          PUBLISH_RUNNER: ${{ vars.SCENE_PUBLISH_RUNNER }}
          GPU_RUNNER: ${{ vars.SCENE_GPU_RUNNER }}
          TRIAL_PACKAGE: ${{ inputs.smoke_mode == 'trial-package' }}
          APPROVE_TRIALS: ${{ inputs.publish_trials }}
        run: |
          python - <<'PY'
          import os, re
          trial = os.environ["TRIAL_PACKAGE"] == "true"
          if (os.environ["APPROVE_TRIALS"] if trial else os.environ["APPROVE"]) != "true" or (not trial and os.environ["SOURCE"] != "public-preview"):
              raise SystemExit("Trial export requires publish_trials=true." if trial else "Package mode requires publish_pilots=true and smoke_source=public-preview.")
          label = os.environ["PUBLISH_RUNNER"]
          if not re.fullmatch(r"[A-Za-z0-9][A-Za-z0-9_.-]{0,99}", label) or label == os.environ["GPU_RUNNER"]:
              raise SystemExit("Configure SCENE_PUBLISH_RUNNER as a distinct CPU publisher label and isolated work directory.")
          PY
  publication:
    needs: publication-readiness
    runs-on: ${{ vars.SCENE_PUBLISH_RUNNER }}
    timeout-minutes: 30
    env:
      PYTHONPATH: ${{ github.workspace }}/services/pipeline
      CUDA_VISIBLE_DEVICES: ""
      HF_TOKEN: ""
      INCREMENTAL: ${{ inputs.incremental_pilots }}
      TRIAL_PACKAGE: ${{ inputs.smoke_mode == 'trial-package' }}
    steps:
      - name: Verify isolated publisher workspace before checkout
        run: |
          /home/scene/scene-worker-venv/bin/python - <<'PY'
          import os
          from pathlib import Path
          workspace = Path(os.environ["GITHUB_WORKSPACE"]).resolve()
          publisher = Path("/home/scene/scene-worker/publisher-work").resolve()
          if not workspace.is_relative_to(publisher):
              raise SystemExit("Use the separate publisher runner work directory; the GPU checkout must remain untouched.")
          PY
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Snapshot only independently validated stopped cases
        if: inputs.smoke_mode == 'package'
        run: |
          umask 077
          args=()
          if [ "$INCREMENTAL" = true ]; then args+=(--incremental); fi
          /home/scene/scene-worker-venv/bin/python -m scripts.package_pilots \
            --data-dir /home/scene/scene-private-data \
            --out "$RUNNER_TEMP/pilot-publication-$GITHUB_RUN_ID" \
            --approve-derived-publication "${args[@]}"
      - name: Package only approved generated trials and validated outputs
        if: inputs.smoke_mode == 'trial-package'
        run: |
          umask 077
          /home/scene/scene-worker-venv/bin/python -m scripts.package_trials \
            --data-dir /home/scene/scene-private-data \
            --out "$RUNNER_TEMP/trial-publication-$GITHUB_RUN_ID" \
            --approve-generated-trial-publication
      - name: Upload only approved public package
        if: inputs.smoke_mode == 'package'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pilot-publication-${{ github.run_id }}
          path: ${{ runner.temp }}/pilot-publication-${{ github.run_id }}/
          if-no-files-found: error
          retention-days: 7
      - name: Upload only approved trial package
        if: inputs.smoke_mode == 'trial-package'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: trial-publication-${{ github.run_id }}
          path: ${{ runner.temp }}/trial-publication-${{ github.run_id }}/
          if-no-files-found: error
          retention-days: 7
  readiness:
    if: inputs.smoke_mode == 'off' || inputs.smoke_mode == ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      RUNNER_LABEL: ${{ vars.SCENE_GPU_RUNNER }}
      CASES: ${{ inputs.cases }}
      HF_TOKEN: ${{ secrets.HF_TOKEN || vars.HF_TOKEN }}
      SCENE_IDOL_MODEL_REVISION: ${{ vars.SCENE_IDOL_MODEL_REVISION }}
      SCENE_DINOV3_REVISION: ${{ vars.SCENE_DINOV3_REVISION }}
      SCENE_FLUX2_REVISION: ${{ vars.SCENE_FLUX2_REVISION }}
      SCENE_DETECTOR_REVISION: ${{ vars.SCENE_DETECTOR_REVISION }}
      SCENE_SEGMENTER_REVISION: ${{ vars.SCENE_SEGMENTER_REVISION }}
    steps:
      - name: Mask Hugging Face token
        run: |
          python - <<'PY'
          import os
          token = os.environ.get("HF_TOKEN", "")
          if token:
              print("::add-mask::" + token.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A"))
          PY
      - name: Validate configured runner and fixed case list before GPU allocation
        run: |
          python - <<'PY'
          import os
          label = os.environ.get("RUNNER_LABEL", "")
          if not label:
              raise SystemExit("Set SCENE_GPU_RUNNER to an actual configured GPU runner label. No GPU job was queued.")
          if not os.environ.get("HF_TOKEN"):
              raise SystemExit("Set HF_TOKEN as an Actions secret or a masked repository Actions variable. No GPU job was queued.")
          cases = os.environ["CASES"].split()
          if not cases or len(cases) != len(set(cases)) or any(c not in ("P01", "P02", "P03") for c in cases):
              raise SystemExit("Only unique P01/P02/P03 procedural cases are permitted in this public-repository workflow.")
          names = ("SCENE_IDOL_MODEL_REVISION", "SCENE_DINOV3_REVISION", "SCENE_FLUX2_REVISION")
          for name in names:
              value = os.environ.get(name, "")
              if len(value) != 40 or any(char not in "0123456789abcdef" for char in value):
                  raise SystemExit(f"Configure {name} as a full lowercase 40-character model commit. No GPU job was queued.")
          if any(not os.environ.get(name) for name in ("SCENE_DETECTOR_REVISION", "SCENE_SEGMENTER_REVISION")):
              raise SystemExit("Configure exact Grounding DINO and SAM2 commit revisions before image-case GPU jobs.")
          print("GPU label, token, model pins and requested cases are configured; no credential values were printed.")
          PY
  infer:
    needs: readiness
    if: (inputs.smoke_mode == 'off' || inputs.smoke_mode == '') && vars.SCENE_GPU_RUNNER != ''
    runs-on: ${{ vars.SCENE_GPU_RUNNER }}
    timeout-minutes: 90
    environment: scene-gpu
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN || vars.HF_TOKEN }}
      SCENE_IDOL_MODEL_REVISION: ${{ vars.SCENE_IDOL_MODEL_REVISION }}
      SCENE_DINOV3_REVISION: ${{ vars.SCENE_DINOV3_REVISION }}
      SCENE_FLUX2_REVISION: ${{ vars.SCENE_FLUX2_REVISION }}
      SCENE_DETECTOR_REVISION: ${{ vars.SCENE_DETECTOR_REVISION }}
      SCENE_SEGMENTER_REVISION: ${{ vars.SCENE_SEGMENTER_REVISION }}
      CASES: ${{ inputs.cases }}
      ATTN_BACKEND: sdpa
    steps:
      - name: Configure isolated job storage
        run: echo "SCENE_DATA_DIR=$RUNNER_TEMP/scene-data" >> "$GITHUB_ENV"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Verify CUDA before installing inference packages
        run: nvidia-smi
      - name: Install declared toolchain and pinned Idol SDK
        run: |
          python -m venv "$RUNNER_TEMP/scene-venv"
          "$RUNNER_TEMP/scene-venv/bin/pip" install -e ".[vision]" -r requirements-idol.txt
          echo "$RUNNER_TEMP/scene-venv/bin" >> "$GITHUB_PATH"
      - name: Verify Blender is available
        run: blender --background --version
      - name: Execute only validated case IDs
        run: |
          python - <<'PY'
          import os, subprocess
          cases = os.environ["CASES"].split()
          if any(c not in ("P01", "P02", "P03") for c in cases):
              raise SystemExit("Unsupported case ID")
          subprocess.run(["scene-toolchain", "run", "--cases", *cases,
                          "--stages", "extract", "blender", "idol",
                          "--report", os.environ["RUNNER_TEMP"] + "/gpu-report.json"], check=True)
          PY
      - name: Publish batch report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: gpu-report
          path: ${{ runner.temp }}/gpu-report.json
          retention-days: 7
          if-no-files-found: warn
      - name: Publish approved procedural outputs only
        if: success() && inputs.publish_assets
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: procedural-scene-assets
          path: ${{ runner.temp }}/scene-data/assets
          retention-days: 7
      - name: Remove per-job credentials from the environment scope
        if: always()
        run: |
          echo "HF_TOKEN=" >> "$GITHUB_ENV"
