name: CPU toolchain checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-and-blender:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq blender python3-numpy tesseract-ocr tesseract-ocr-jpn
      - run: pip install -e ".[test,ocr]"
      - run: python -m unittest discover -s tests -v
      - name: Confirm generated schema is current
        run: scene-toolchain schema > /tmp/scene.schema.json && diff schemas/scene.schema.json /tmp/scene.schema.json
      - name: Exercise all procedural cases through Blender
        run: scene-toolchain --data-dir /tmp/scene-cases run --cases P01 P02 P03 --stages extract blender --report /tmp/procedural-report.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: procedural-report
          path: /tmp/procedural-report.json
          if-no-files-found: warn
          retention-days: 7
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
          cache: npm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - run: pip install -e .
      - run: npm ci
      - run: npm run build
      - run: npm test -- --run
      - run: npm run build:demo
      - name: Publish public read-only demo build
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: static-demo-${{ github.sha }}
          path: apps/web/dist-demo/
          if-no-files-found: error
          retention-days: 7
