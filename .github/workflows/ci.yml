name: CPU toolchain checks

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      deploy:
        description: "Deploy the read-only dist-demo build to the dedicated Free Azure Static Web App"
        required: false
        default: false
        type: boolean
      pilot_run_id:
        description: "Optional reviewed GPU run ID containing explicitly approved pilot-publication-<runID> artifact"
        required: false
        default: ""
        type: string

permissions:
  contents: read

jobs:
  python-and-blender:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq blender python3-numpy tesseract-ocr tesseract-ocr-jpn
      - run: pip install -e ".[test,ocr]"
      - run: python -m unittest discover -s tests -v
      - name: Confirm generated schema is current
        run: scene-toolchain schema > /tmp/scene.schema.json && diff schemas/scene.schema.json /tmp/scene.schema.json
      - name: Exercise all procedural cases through Blender
        run: scene-toolchain --data-dir /tmp/scene-cases run --cases P01 P02 P03 --stages extract blender --report /tmp/procedural-report.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: procedural-report
          path: /tmp/procedural-report.json
          if-no-files-found: warn
          retention-days: 7
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
          cache: npm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - run: pip install -e .
      - run: npm ci
      - run: npm run build
      - run: npm test -- --run
      - name: Download explicitly selected approved pilot package
        if: github.event_name == 'workflow_dispatch' && inputs.pilot_run_id != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PILOT_RUN_ID: ${{ inputs.pilot_run_id }}
        run: |
          python - <<'PY'
          import json, os, re, subprocess
          from pathlib import Path
          from scripts.package_pilots import validate_package
          run_id = os.environ["PILOT_RUN_ID"]
          if not re.fullmatch(r"[0-9]+", run_id):
              raise SystemExit("pilot_run_id must be an explicit numeric Actions run ID.")
          repository = os.environ["GITHUB_REPOSITORY"]
          run = json.loads(subprocess.check_output(
              ["gh", "api", f"repos/{repository}/actions/runs/{run_id}"], text=True))
          workflow = json.loads(subprocess.check_output(
              ["gh", "api", f"repos/{repository}/actions/workflows/gpu-batch.yml"], text=True))
          expected_path = ".github/workflows/gpu-batch.yml"
          if (run["status"] != "completed" or run["head_branch"] != os.environ["GITHUB_REF_NAME"]
              or run["path"] != expected_path or workflow["path"] != expected_path
              or run["workflow_id"] != workflow["id"]):
              raise SystemExit("Select a completed trusted GPU workflow on this same branch.")
          destination = Path(os.environ["RUNNER_TEMP"]) / ("pilot-publication-" + run_id)
          subprocess.run(["gh", "run", "download", run_id, "--repo", repository,
                          "--name", "pilot-publication-" + run_id, "--dir", str(destination)], check=True)
          validate_package(destination)
          with open(os.environ["GITHUB_ENV"], "a") as stream:
              stream.write("SCENE_PILOT_PUBLIC_PACKAGE=" + str(destination) + "\n")
          PY
      - run: npm run build:demo
      - name: Publish public read-only demo build
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: static-demo-${{ github.sha }}
          path: apps/web/dist-demo/
          if-no-files-found: error
          retention-days: 7
      - name: Deploy public read-only demo
        if: github.event_name == 'workflow_dispatch' && inputs.deploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_SCENE_POC }}
          action: upload
          app_location: apps/web/dist-demo
          api_location: ""
          output_location: ""
          skip_app_build: true
